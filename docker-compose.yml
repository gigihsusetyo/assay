services:
  postgres:
    image: postgres:16
    container_name: assay-postgres
    environment:
      POSTGRES_USER: assay
      POSTGRES_PASSWORD: assay
      POSTGRES_DB: assay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assay -d assay"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
