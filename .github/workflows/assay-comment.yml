name: Assay PR Comment

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: write
  contents: read

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Start mock RAG
        run: |
          python -m uvicorn examples.mock_rag.app:app --host 0.0.0.0 --port 9000 &
          sleep 3
          curl -f http://localhost:9000/health || exit 1

      - name: Setup dataset and baseline
        run: |
          assay dataset create comment-demo --description "PR comment demo"
          assay dataset add-question 1 \
            --question "How do I reset my password?" \
            --answer "Go to settings and click reset password." \
            --context "You can reset your password in settings."
          assay dataset add-question 1 \
            --question "How do I configure SSO?" \
            --answer "Go to settings, select SSO, and enter provider details." \
            --context "SSO configuration is available in settings."
          assay run create --dataset 1 --name comment-baseline --target http://localhost:9000/query
          assay run execute 1 --verbose
          assay baseline create --name comment-baseline --run 1

      - name: Run current evaluation
        run: |
          assay run create --dataset 1 --name comment-current --target http://localhost:9000/query
          assay run execute 2 --verbose

      - name: Run gate and capture JSON
        run: |
          assay gate \
            --baseline comment-baseline \
            --run 2 \
            --policy examples/policy.yaml \
            --format json > /tmp/assay_report.json || true

      - name: Generate Markdown comment
        run: |
          python scripts/pr_comment.py /tmp/assay_report.json > /tmp/assay_comment.md

      - name: Post or update PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: assay-regression-report
          path: /tmp/assay_comment.md
